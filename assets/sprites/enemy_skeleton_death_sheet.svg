<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64">
  <defs>
    <style>
      .out { stroke: #1a1512; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .bone { fill: #e8dfcf; }
      .bone-dark { fill: #b5a993; }
      .metal { fill: #7a848f; }
      .wood { fill: #5c3a21; }
      .socket { fill: #1a1512; stroke: none; }
    </style>
  </defs>

  <!-- FRAME 1: CRÂNIO SE SOLTA (0 a 64px) -->
  <g id="skel_dth_01" class="out">
    <!-- Pernas dobrando -->
    <path d="M23 48 L17 53 L16 58" fill="none" stroke="#b5a993" stroke-width="3" />
    <path d="M31 48 L32 54 L34 58" fill="none" stroke="#e8dfcf" stroke-width="3.2" />
    <!-- Coluna tombando -->
    <path d="M25 40 L27 47" fill="none" stroke="#e8dfcf" stroke-width="3.5" />
    <!-- Crânio voando solto -->
    <circle cx="36" cy="18" r="6" class="bone" transform="rotate(25 36 18)" />
    <ellipse cx="39" cy="18" rx="1.5" ry="1.8" class="socket" />
    <!-- Escudo caindo -->
    <circle cx="16" cy="42" r="6.5" class="wood" />
    <!-- Espada caindo de ponta -->
    <rect x="44" y="28" width="3" height="18" rx="1" class="metal" transform="rotate(40 45 37)" />
  </g>

  <!-- FRAME 2: COLAPSO DAS COSTELAS (64 a 128px) -->
  <g id="skel_dth_02" class="out" transform="translate(64, 0)">
    <path d="M20 53 L15 56 L13 58" fill="none" stroke="#b5a993" stroke-width="3" />
    <path d="M27 52 L29 56 L31 58" fill="none" stroke="#e8dfcf" stroke-width="3.2" />
    <!-- Costelas espalhadas em arco caindo -->
    <path d="M19 46 Q24 43 28 47" stroke="#e8dfcf" stroke-width="2" fill="none" />
    <path d="M21 49 Q25 47 30 50" stroke="#e8dfcf" stroke-width="2" fill="none" />
    <!-- Crânio quicando mais baixo -->
    <circle cx="44" cy="36" r="6" class="bone" transform="rotate(60 44 36)" />
    <ellipse cx="46" cy="37" rx="1.5" ry="1.8" class="socket" />
    <!-- Escudo tombado -->
    <ellipse cx="14" cy="52" rx="6" ry="4" class="wood" />
    <!-- Espada quase no chão -->
    <rect x="42" y="47" width="18" height="3" rx="1" class="metal" transform="rotate(15 51 48)" />
  </g>

  <!-- FRAME 3: IMPACTO NO CHÃO (128 a 192px) -->
  <g id="skel_dth_03" class="out" transform="translate(128, 0)">
    <!-- Ossos longos cruzados na base -->
    <line x1="16" y1="56" x2="28" y2="57" stroke="#e8dfcf" stroke-width="3" />
    <line x1="22" y1="55" x2="33" y2="58" stroke="#b5a993" stroke-width="2.8" />
    <path d="M18 53 Q23 52 26 55" stroke="#e8dfcf" stroke-width="2" fill="none" />
    <!-- Escudo apoiado plano -->
    <ellipse cx="13" cy="56" rx="6" ry="2.5" class="wood" />
    <!-- Crânio de lado no chão -->
    <circle cx="43" cy="52" r="5.8" class="bone" />
    <ellipse cx="45" cy="52" rx="1.5" ry="1.5" class="socket" />
    <!-- Espada caída no chão -->
    <rect x="29" y="56" width="19" height="2.5" rx="1" class="metal" />
  </g>

  <!-- FRAME 4: PILHA INERTE / REPOUSO (192 a 256px) -->
  <g id="skel_dth_04" class="out" transform="translate(192, 0)">
    <!-- Ossada compactada em repouso definitivo -->
    <line x1="17" y1="57" x2="29" y2="57" stroke="#b5a993" stroke-width="3" />
    <line x1="21" y1="56" x2="31" y2="58" stroke="#e8dfcf" stroke-width="2.8" />
    <ellipse cx="14" cy="57" rx="6" ry="2.2" class="wood" />
    <circle cx="40" cy="53.5" r="5.5" class="bone" />
    <ellipse cx="42" cy="53.5" rx="1.4" ry="1.4" class="socket" />
    <rect x="27" y="57" width="19" height="2.2" rx="1" class="metal" />
  </g>
</svg>