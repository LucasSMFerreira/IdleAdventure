<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 64" width="512" height="64">
  <defs>
    <style>
      .out { stroke: #111417; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #365327; }
      .armor { fill: #2f3640; }
      .armor-light { fill: #57606f; }
      .gold { fill: #d4af37; }
      .metal { fill: #747d8c; }
      .wood { fill: #2d1d11; }
      .rage { fill: none; stroke: #ff9f43; stroke-width: 2.2; stroke-linecap: round; }
      .quake { fill: #ee5253; stroke: #ff9f43; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- F1: RUGIDO DE FÚRIA (0 a 64px) -->
  <g id="sp_01" class="out">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
    <circle cx="29" cy="15" r="8.5" class="skin" />
    <circle cx="34" cy="14" r="2.2" fill="#ff9f43" stroke="none" />
    <!-- Faíscas de fúria saindo dos olhos -->
    <path d="M37 12 L43 9 M38 16 L44 18" class="rage" />
  </g>

  <!-- F2: IMPULSÃO / SALTO (64 a 128px) -->
  <g id="sp_02" class="out" transform="translate(64, 0)">
    <!-- Pernas comprimidas para impulsão -->
    <path d="M18 47 L12 55 L17 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 47 L36 55 L41 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="16" y="27" width="26" height="21" rx="4" class="skin" />
    <circle cx="29" cy="18" r="8.5" class="skin" />
    <rect x="6" y="8" width="5" height="42" rx="1.5" class="wood" transform="rotate(-60 8 29)" />
  </g>

  <!-- F3: VÉRTICE AÉREO (128 a 192px) -->
  <g id="sp_03" class="out" transform="translate(128, 0)">
    <!-- Corpo suspenso no ar acima do chão -->
    <g transform="translate(0, -8)">
      <rect x="18" y="44" width="8" height="12" rx="2.5" class="armor" />
      <rect x="32" y="44" width="8" height="12" rx="2.5" class="armor" />
      <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
      <circle cx="29" cy="15" r="8.5" class="skin" />
      <rect x="17" y="0" width="5" height="42" rx="1.5" class="wood" transform="rotate(-85 19 21)" />
      <path d="M5 6 C-1 0 -5 2 -6 8 C-6 18 2 22 8 17 Z" class="metal" />
    </g>
  </g>

  <!-- F4: DESABAMENTO (192 a 256px) -->
  <g id="sp_04" class="out" transform="translate(192, 0)">
    <path d="M16 46 L8 53 L10 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 46 L40 53 L45 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="22" y="27" width="26" height="21" rx="4" class="skin" transform="rotate(18 35 37)" />
    <circle cx="38" cy="18" r="8.5" class="skin" />
    <rect x="42" y="22" width="5" height="42" rx="1.5" class="wood" transform="rotate(55 44 43)" />
  </g>

  <!-- F5: CHOQUE SÍSMICO / ONDAS (256 a 320px) -->
  <g id="sp_05" class="out" transform="translate(256, 0)">
    <!-- Machado fincado profundamente gerando cratera -->
    <rect x="38" y="27" width="5" height="42" rx="1.5" class="wood" transform="rotate(35 40 48)" />
    <path d="M49 35 C56 29 60 31 61 37 C61 47 53 52 46 47 Z" class="metal" />
    <!-- Espinhos de Rocha e Energia do Solo -->
    <polygon points="46,58 50,46 54,58" class="quake" />
    <polygon points="53,58 57,40 61,58" class="quake" />
    <polygon points="60,58 63,48 66,58" class="quake" />
    <rect x="18" y="27" width="26" height="21" rx="4" class="skin" />
  </g>

  <!-- F6: EXPANSÃO SÍSMICA (320 a 384px) -->
  <g id="sp_06" class="out" transform="translate(320, 0)">
    <rect x="38" y="28" width="5" height="42" rx="1.5" class="wood" transform="rotate(35 40 49)" />
    <path d="M49 36 C56 30 60 32 61 38 C61 48 53 53 46 48 Z" class="metal" />
    <!-- Cristas de choque avançando para a extremidade -->
    <polygon points="50,58 53,50 56,58" class="quake" />
    <polygon points="57,58 61,42 65,58" class="quake" />
    <polygon points="66,58 70,36 74,58" class="quake" />
    <rect x="18" y="27" width="26" height="21" rx="4" class="skin" />
  </g>

  <!-- F7: DISSIPAÇÃO DO IMPACTO (384 a 448px) -->
  <g id="sp_07" class="out" transform="translate(384, 0)">
    <rect x="39" y="27" width="5" height="42" rx="1.5" class="wood" transform="rotate(25 41 48)" />
    <polygon points="58,58 61,52 64,58" class="quake" opacity="0.6" />
    <rect x="17" y="26" width="26" height="22" rx="4" class="skin" />
    <circle cx="30" cy="16" r="8.5" class="skin" />
  </g>

  <!-- F8: ERGUIMENTO DA ARMA (448 a 512px) -->
  <g id="sp_08" class="out" transform="translate(448, 0)">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="10" y="16" width="5" height="42" rx="1.5" class="wood" transform="rotate(-10 12 37)" />
    <path d="M6 14 C-1 8 -5 11 -7 18 C-7 28 1 33 8 26 Z" class="metal" />
    <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
    <circle cx="29" cy="15" r="8.5" class="skin" />
  </g>
</svg>