<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <style>
      .out { stroke: #111417; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #365327; }
      .skin-hit { fill: #4c7337; }
      .armor { fill: #2f3640; }
      .armor-light { fill: #57606f; }
      .metal { fill: #747d8c; }
      .wood { fill: #2d1d11; }
      .hit-boss-fx { stroke: #ff9f43; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- FRAME 1: IMPACTO BRUTO (0 a 64px) -->
  <g id="king_hit_01" class="out">
    <path d="M48 18 L54 13 M51 26 L58 27 M47 34 L54 38" class="hit-boss-fx" />
    <!-- Pernas rígidas no solo suportando o golpe -->
    <path d="M16 46 L10 53 L12 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M30 46 L28 53 L31 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="1" y="20" width="5" height="42" rx="1.5" class="wood" transform="rotate(-30 3 41)" />
    <rect x="13" y="25" width="26" height="23" rx="4" class="skin-hit" transform="rotate(-10 26 36)" />
    <circle cx="24" cy="15" r="8.5" class="skin-hit" />
    <!-- Olho fechado em fúria -->
    <path d="M26 14 L30 16 M30 14 L26 16" stroke="#111417" stroke-width="2" fill="none" />
    <path d="M17 11 L18 6 L21 9 L24 4 L27 9 L30 6 L31 11 Z" class="armor-light" />
  </g>

  <!-- FRAME 2: RETOMADA DE POSTURA (64 a 128px) -->
  <g id="king_hit_02" class="out" transform="translate(64, 0)">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="7" y="17" width="5" height="42" rx="1.5" class="wood" transform="rotate(-18 9 38)" />
    <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
    <circle cx="29" cy="15" r="8.5" class="skin" />
    <circle cx="33" cy="14" r="1.6" fill="#ff4757" stroke="none" />
    <path d="M22 11 L23 6 L26 9 L29 4 L32 9 L35 6 L36 11 Z" class="armor-light" />
  </g>
</svg>