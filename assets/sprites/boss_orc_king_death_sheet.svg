<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 64" width="512" height="64">
  <defs>
    <style>
      .out { stroke: #111417; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #365327; }
      .skin-down { fill: #233718; }
      .armor { fill: #2f3640; }
      .armor-light { fill: #57606f; }
      .gold { fill: #d4af37; }
      .cape { fill: #8b0000; }
      .metal { fill: #747d8c; }
      .wood { fill: #2d1d11; }
    </style>
  </defs>

  <!-- F1: GOLPE FATAL (0 a 64px) -->
  <g id="kdth_01" class="out">
    <path d="M16 46 L10 53 L12 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M30 46 L28 53 L31 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="0" y="20" width="5" height="42" rx="1.5" class="wood" transform="rotate(-40 2 41)" />
    <rect x="13" y="25" width="26" height="23" rx="4" class="skin" transform="rotate(-15 26 36)" />
    <circle cx="23" cy="15" r="8.5" class="skin" />
    <!-- Coroa quebrando -->
    <path d="M17 11 L18 6 L21 9 L24 4 L26 8" class="armor-light" />
  </g>

  <!-- F2: MACHADO ESCAPA (64 a 128px) -->
  <g id="kdth_02" class="out" transform="translate(64, 0)">
    <path d="M18 48 L12 54 L14 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M30 48 L27 54 L31 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <!-- Machado voando para trás -->
    <rect x="44" y="20" width="5" height="42" rx="1.5" class="wood" transform="rotate(35 46 41)" />
    <rect x="13" y="27" width="26" height="21" rx="4" class="skin" transform="rotate(-25 26 37)" />
    <circle cx="20" cy="18" r="8.5" class="skin" />
    <!-- Coroa caindo no ar -->
    <path d="M4 16 L5 11 L8 14 L11 9 L13 14" class="armor-light" />
  </g>

  <!-- F3: DE JOELHOS (128 a 192px) -->
  <g id="kdth_03" class="out" transform="translate(128, 0)">
    <!-- Joelhos tocando o solo -->
    <path d="M22 51 L14 55 L16 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 51 L28 55 L32 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="14" y="32" width="26" height="19" rx="4" class="skin" transform="rotate(-40 27 41)" />
    <circle cx="17" cy="22" r="8" class="skin" />
    <rect x="42" y="44" width="5" height="30" rx="1.5" class="wood" transform="rotate(70 44 59)" />
  </g>

  <!-- F4: COROA NO CHÃO (192 a 256px) -->
  <g id="kdth_04" class="out" transform="translate(192, 0)">
    <path d="M26 53 L18 57 L14 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="14" y="38" width="26" height="16" rx="4" class="skin" transform="rotate(-60 27 46)" />
    <circle cx="15" cy="28" r="8" class="skin" />
    <!-- Coroa caída no chão à frente -->
    <path d="M38 58 L39 53 L42 56 L45 51 L47 56 L49 58 Z" class="gold" />
    <rect x="40" y="55" width="26" height="4" rx="1.5" class="wood" />
  </g>

  <!-- F5: TOMBAMENTO FRONTAL (256 a 320px) -->
  <g id="kdth_05" class="out" transform="translate(256, 0)">
    <rect x="14" y="45" width="26" height="13" rx="4" class="skin" transform="rotate(-80 27 51)" />
    <!-- Capa cobrindo as costas na queda -->
    <path d="M12 44 C18 42 32 44 38 48 L36 56 L10 56 Z" class="cape" />
    <circle cx="10" cy="38" r="7.5" class="skin" />
    <path d="M42 58 L43 54 L45 56 L48 52 L50 56 L52 58 Z" class="gold" />
  </g>

  <!-- F6: QUEDA PLENA (320 a 384px) -->
  <g id="kdth_06" class="out" transform="translate(320, 0)">
    <rect x="36" y="51" width="18" height="7" rx="2.5" class="armor" />
    <rect x="16" y="47" width="24" height="11" rx="4" class="skin-down" />
    <path d="M14 47 C22 45 32 46 36 50 L34 57 L12 57 Z" class="cape" />
    <circle cx="10" cy="48" r="7" class="skin-down" />
  </g>

  <!-- F7: ASSENTAMENTO (384 a 448px) -->
  <g id="kdth_07" class="out" transform="translate(384, 0)">
    <rect x="35" y="52" width="18" height="6.5" rx="2.5" class="armor" />
    <rect x="15" y="48" width="24" height="10.5" rx="4" class="skin-down" />
    <path d="M13 48 C21 46 31 47 35 51 L33 58 L11 58 Z" class="cape" />
    <circle cx="9" cy="49" r="7" class="skin-down" />
  </g>

  <!-- F8: REPOUSO FINAL DE CHEFE (448 a 512px) -->
  <g id="kdth_08" class="out" transform="translate(448, 0)">
    <!-- Corpo abatido com coroa e machado inertes ao lado -->
    <rect x="34" y="53" width="18" height="6" rx="2.5" class="armor" />
    <rect x="14" y="49" width="24" height="10" rx="4" class="skin-down" />
    <path d="M12 49 C20 47 30 48 34 52 L32 59 L10 59 Z" class="cape" />
    <circle cx="8" cy="50" r="7" class="skin-down" />
    <rect x="36" y="58" width="26" height="3" rx="1.5" class="wood" />
    <path d="M36 54 C32 51 29 52 28 56 C28 60 32 62 35 59 Z" class="metal" />
    <path d="M2 58 L3 55 L5 57 L7 54 L9 57 L10 58 Z" class="gold" />
  </g>
</svg>