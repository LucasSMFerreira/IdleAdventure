<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <style>
      .outline { stroke: #1a1512; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #f0b884; }
      .skin-hit { fill: #ff9e80; }
      .hair { fill: #b5451b; }
      .tunic { fill: #6e4327; }
      .tunic-hit { fill: #9e3d2a; }
      .pants { fill: #453327; }
      .boots { fill: #2e1f16; }
      .metal { fill: #8a939e; }
      .wood { fill: #573822; }
      .gold { fill: #cfa134; }
      .hit-fx { fill: none; stroke: #ffeb3b; stroke-width: 1.8; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ============================================== -->
  <!-- FRAME 1: IMPACTO BRUSCO / RECUO (0 a 64px)     -->
  <!-- ============================================== -->
  <g id="hit_01" class="outline">
    <!-- Efeito de Impacto Estelar na Frente -->
    <path d="M42 26 L46 22 M44 30 L49 32 M41 34 L45 38" class="hit-fx" />
    <!-- Pernas deslocadas para trás no impacto -->
    <path d="M19 48 L14 56 L19 58" fill="none" stroke="#453327" stroke-width="5" />
    <rect x="13" y="56" width="7" height="4" rx="1.5" class="boots" />
    <path d="M27 48 L25 56 L30 58" fill="none" stroke="#453327" stroke-width="5" />
    <rect x="25" y="56" width="7" height="4" rx="1.5" class="boots" />
    <!-- Machado caindo para trás desestabilizado -->
    <rect x="5" y="32" width="3" height="22" rx="1" class="wood" transform="rotate(-45 6 43)" />
    <path d="M5 26 C2 22 -2 24 -3 28 C-3 34 2 36 5 33 Z" class="metal" />
    <!-- Tronco inclinado para trás e avermelhado -->
    <rect x="16" y="32" width="16" height="16" rx="3" class="tunic-hit" transform="rotate(-15 24 40)" />
    <rect x="15" y="43" width="18" height="4" class="boots" transform="rotate(-15 24 45)" />
    <!-- Cabeça jogada para trás com expressão de dor -->
    <circle cx="26" cy="20" r="9" class="skin-hit" />
    <path d="M17 17 C17 10 33 10 35 17 C35 19 33 21 31 20 Z" class="hair" />
    <path d="M20 23 C20 33 29 34 33 28 Z" class="hair" />
    <!-- Olho fechado em aperto (X ou linha angular) -->
    <path d="M29 18 L33 21 M33 18 L29 21" stroke="#1a1512" stroke-width="1.5" fill="none" />
    <!-- Braço jogado para trás -->
    <rect x="19" y="33" width="5" height="9" rx="2.5" class="skin-hit" transform="rotate(-25 21 37)" />
  </g>

  <!-- ============================================== -->
  <!-- FRAME 2: RECUPERAÇÃO DO IMPACTO (64 a 128px)   -->
  <!-- ============================================== -->
  <g id="hit_02" class="outline" transform="translate(64, 0)">
    <!-- Base assentando o peso -->
    <rect x="21" y="47" width="5" height="11" rx="2" class="pants" />
    <rect x="21" y="55" width="7" height="5" rx="1.5" class="boots" />
    <rect x="29" y="47" width="5" height="11" rx="2" class="pants" />
    <rect x="29" y="55" width="7" height="5" rx="1.5" class="boots" />
    <!-- Machado voltando à pegada firme -->
    <rect x="10" y="32" width="3" height="22" rx="1" class="wood" transform="rotate(-25 11 43)" />
    <path d="M10 27 C7 23 3 24 2 28 C2 34 7 36 10 33 Z" class="metal" />
    <!-- Tronco voltando ao prumo normal -->
    <rect x="19" y="33" width="16" height="16" rx="3" class="tunic" transform="rotate(-5 27 41)" />
    <rect x="18" y="44" width="18" height="4" class="boots" transform="rotate(-5 27 46)" />
    <rect x="26" y="44" width="4" height="4" class="gold" transform="rotate(-5 27 46)" />
    <!-- Cabeça e Barba -->
    <circle cx="29" cy="22" r="9" class="skin" />
    <path d="M20 20 C20 13 36 12 37 19 C37 21 35 23 33 22 Z" class="hair" />
    <path d="M23 24 C23 34 31 36 36 30 Z" class="hair" />
    <!-- Olho semicerrado focado à frente -->
    <circle cx="32" cy="21" r="1.3" fill="#1a1512" stroke="none" />
    <path d="M29 18 L34 20" stroke="#8c2f0d" stroke-width="2" fill="none" />
    <!-- Braço em guarda -->
    <rect x="25" y="34" width="5" height="9" rx="2.5" class="skin" />
    <rect x="25" y="39" width="5" height="3" class="boots" />
  </g>
</svg>