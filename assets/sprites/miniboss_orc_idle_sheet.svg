<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64">
  <defs>
    <style>
      .out { stroke: #1a1512; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #486b36; }
      .skin-dark { fill: #324c25; }
      .armor { fill: #576574; }
      .armor-dark { fill: #343c45; }
      .leather { fill: #483423; }
      .metal { fill: #8395a7; }
      .metal-edge { fill: #c8d6e5; }
      .tusk { fill: #f1f2f6; }
      .wood { fill: #382313; }
    </style>
  </defs>

  <!-- FRAME 1: BASE (0 a 64px) -->
  <g id="orc_idle_01" class="out">
    <!-- Pernas largas e musculosas -->
    <rect x="20" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="18" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="33" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="33" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <!-- Machado Pesado Apoiado Atrás -->
    <rect x="8" y="24" width="4" height="34" rx="1" class="wood" transform="rotate(-18 10 41)" />
    <path d="M4 18 C0 12 -4 14 -6 20 C-6 28 0 32 6 27 Z" class="metal" />
    <path d="M1 17 C-2 22 -2 25 1 29" stroke="#c8d6e5" stroke-width="1.2" fill="none" />
    <!-- Tronco Largo e Placa Peitoral -->
    <rect x="18" y="28" width="24" height="19" rx="4" class="skin" />
    <path d="M20 30 L40 30 L38 43 L22 43 Z" class="armor" />
    <rect x="18" y="43" width="24" height="4.5" class="leather" />
    <!-- Ombreira Esquerda de Ferro (Costas) -->
    <circle cx="17" cy="27" r="5" class="armor-dark" />
    <!-- Cabeça e Mandíbula Larga -->
    <circle cx="30" cy="18" r="8" class="skin" />
    <rect x="28" y="22" width="8" height="4.5" rx="1.5" class="skin" />
    <!-- Presas Inferiores -->
    <polygon points="32,23 33.5,19 35,23" class="tusk" />
    <!-- Olho Vermelho Ferroz -->
    <circle cx="34" cy="17" r="1.6" fill="#e74c3c" stroke="none" />
    <!-- Ombreira Direita com Espinho (Frente) -->
    <circle cx="25" cy="28" r="5.5" class="armor" />
    <polygon points="25,23 23,17 27,22" class="armor-dark" />
    <!-- Braço Direito Forte e Bracelete -->
    <rect x="34" y="30" width="7" height="10" rx="3" class="skin" />
    <rect x="34" y="37" width="7" height="3.5" class="armor-dark" />
  </g>

  <!-- FRAME 2: INSPIRAÇÃO (64 a 128px) -->
  <g id="orc_idle_02" class="out" transform="translate(64, 0)">
    <rect x="20" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="18" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="33" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="33" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <!-- Machado sutilmente erguido -->
    <rect x="8" y="23" width="4" height="34" rx="1" class="wood" transform="rotate(-16 10 40)" />
    <path d="M4 17 C0 11 -4 13 -6 19 C-6 27 0 31 6 26 Z" class="metal" />
    <path d="M1 16 C-2 21 -2 24 1 28" stroke="#c8d6e5" stroke-width="1.2" fill="none" />
    <!-- Tronco elevado 1px -->
    <rect x="18" y="27" width="24" height="20" rx="4" class="skin" />
    <path d="M20 29 L40 29 L38 42 L22 42 Z" class="armor" />
    <rect x="18" y="43" width="24" height="4.5" class="leather" />
    <circle cx="17" cy="26" r="5" class="armor-dark" />
    <circle cx="30" cy="17" r="8" class="skin" />
    <rect x="28" y="21" width="8" height="4.5" rx="1.5" class="skin" />
    <polygon points="32,22 33.5,18 35,22" class="tusk" />
    <circle cx="34" cy="16" r="1.6" fill="#e74c3c" stroke="none" />
    <circle cx="25" cy="27" r="5.5" class="armor" />
    <polygon points="25,22 23,16 27,21" class="armor-dark" />
    <rect x="34" y="29" width="7" height="10" rx="3" class="skin" />
    <rect x="34" y="36" width="7" height="3.5" class="armor-dark" />
  </g>

  <!-- FRAME 3: PICO RESPIRATÓRIO (128 a 192px) -->
  <g id="orc_idle_03" class="out" transform="translate(128, 0)">
    <rect x="20" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="18" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="33" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="33" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="8" y="22" width="4" height="34" rx="1" class="wood" transform="rotate(-15 10 39)" />
    <path d="M4 16 C0 10 -4 12 -6 18 C-6 26 0 30 6 25 Z" class="metal" />
    <path d="M1 15 C-2 20 -2 23 1 27" stroke="#c8d6e5" stroke-width="1.2" fill="none" />
    <!-- Expansão torácica máxima -->
    <rect x="17.5" y="26.5" width="25" height="20.5" rx="4" class="skin" />
    <path d="M19.5 28.5 L40.5 28.5 L38.5 42 L21.5 42 Z" class="armor" />
    <rect x="18" y="43" width="24" height="4.5" class="leather" />
    <circle cx="17" cy="25.5" r="5" class="armor-dark" />
    <circle cx="30" cy="16.5" r="8" class="skin" />
    <rect x="28" y="20.5" width="8" height="4.5" rx="1.5" class="skin" />
    <polygon points="32,21.5 33.5,17.5 35,21.5" class="tusk" />
    <circle cx="34" cy="15.5" r="1.6" fill="#e74c3c" stroke="none" />
    <circle cx="25" cy="26.5" r="5.5" class="armor" />
    <polygon points="25,21.5 23,15.5 27,20.5" class="armor-dark" />
    <rect x="34" y="28.5" width="7" height="10" rx="3" class="skin" />
    <rect x="34" y="35.5" width="7" height="3.5" class="armor-dark" />
  </g>

  <!-- FRAME 4: EXALAÇÃO (192 a 256px) -->
  <g id="orc_idle_04" class="out" transform="translate(192, 0)">
    <rect x="20" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="18" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="33" y="46" width="7" height="12" rx="2.5" class="leather" />
    <rect x="33" y="55" width="9" height="5" rx="1.5" class="armor-dark" />
    <rect x="8" y="23.5" width="4" height="34" rx="1" class="wood" transform="rotate(-17 10 40.5)" />
    <path d="M4 17.5 C0 11.5 -4 13.5 -6 19.5 C-6 27.5 0 31.5 6 26.5 Z" class="metal" />
    <rect x="18" y="27.5" width="24" height="19.5" rx="4" class="skin" />
    <path d="M20 29.5 L40 29.5 L38 42.5 L22 42.5 Z" class="armor" />
    <rect x="18" y="43" width="24" height="4.5" class="leather" />
    <circle cx="17" cy="26.5" r="5" class="armor-dark" />
    <circle cx="30" cy="17.5" r="8" class="skin" />
    <rect x="28" y="21.5" width="8" height="4.5" rx="1.5" class="skin" />
    <polygon points="32,22.5 33.5,18.5 35,22.5" class="tusk" />
    <circle cx="34" cy="16.5" r="1.6" fill="#e74c3c" stroke="none" />
    <circle cx="25" cy="27.5" r="5.5" class="armor" />
    <polygon points="25,22.5 23,16.5 27,21.5" class="armor-dark" />
    <rect x="34" y="29.5" width="7" height="10" rx="3" class="skin" />
    <rect x="34" y="36.5" width="7" height="3.5" class="armor-dark" />
  </g>
</svg>