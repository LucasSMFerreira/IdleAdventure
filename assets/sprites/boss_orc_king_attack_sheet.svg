<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 64" width="384" height="64">
  <defs>
    <style>
      .out { stroke: #111417; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #365327; }
      .armor { fill: #2f3640; }
      .armor-light { fill: #57606f; }
      .gold { fill: #d4af37; }
      .cape { fill: #8b0000; }
      .metal { fill: #747d8c; }
      .wood { fill: #2d1d11; }
      .king-slash { fill: none; stroke: #ff3838; stroke-width: 3.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- FRAME 1: BASE (0 a 64px) -->
  <g id="king_atk_01" class="out">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="8" y="16" width="5" height="42" rx="1.5" class="wood" transform="rotate(-15 10 37)" />
    <path d="M3 14 C-4 8 -8 11 -10 18 C-10 28 -2 33 5 26 Z" class="metal" />
    <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
    <path d="M18 26 L40 26 L38 43 L20 43 Z" class="armor" />
    <circle cx="29" cy="15" r="8.5" class="skin" />
    <circle cx="33" cy="14" r="1.6" fill="#ff4757" stroke="none" />
    <path d="M22 11 L23 6 L26 9 L29 4 L32 9 L35 6 L36 11 Z" class="armor-light" />
    <circle cx="25" cy="25" r="6.5" class="armor-light" />
  </g>

  <!-- FRAME 2: CARGA / PUXADA DE OMBRO (64 a 128px) -->
  <g id="king_atk_02" class="out" transform="translate(64, 0)">
    <path d="M18 45 L13 53 L14 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 45 L34 53 L37 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <!-- Machado empurrado para trás -->
    <rect x="0" y="18" width="5" height="42" rx="1.5" class="wood" transform="rotate(-48 2 39)" />
    <path d="M-4 13 C-11 7 -15 10 -17 17 C-17 27 -9 32 -2 25 Z" class="metal" />
    <rect x="14" y="25" width="26" height="23" rx="4" class="skin" transform="rotate(-8 27 36)" />
    <circle cx="27" cy="16" r="8.5" class="skin" />
    <circle cx="31" cy="15" r="1.6" fill="#ff4757" stroke="none" />
    <path d="M20 12 L21 7 L24 10 L27 5 L30 10 L33 7 L34 12 Z" class="armor-light" />
    <circle cx="23" cy="26" r="6.5" class="armor-light" />
  </g>

  <!-- FRAME 3: ELEVAÇÃO MÁXIMA (128 a 192px) -->
  <g id="king_atk_03" class="out" transform="translate(128, 0)">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <!-- Machado duplo acima da coroa -->
    <rect x="17" y="2" width="5" height="42" rx="1.5" class="wood" transform="rotate(-78 19 23)" />
    <path d="M5 8 C-1 2 -5 4 -6 10 C-6 20 2 24 8 19 Z" class="metal" />
    <path d="M12 4 C18 -2 22 0 24 6 C24 16 16 20 10 15 Z" class="metal" />
    <rect x="17" y="23" width="26" height="23" rx="4" class="skin" />
    <circle cx="30" cy="15" r="8.5" class="skin" />
    <circle cx="34" cy="14" r="1.6" fill="#ff4757" stroke="none" />
    <path d="M23 11 L24 6 L27 9 L30 4 L33 9 L36 6 L37 11 Z" class="armor-light" />
  </g>

  <!-- FRAME 4: CORTE ESMAGADOR (192 a 256px) -->
  <g id="king_atk_04" class="out" transform="translate(192, 0)">
    <!-- Base aberta agressiva -->
    <path d="M16 46 L8 53 L10 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 46 L40 53 L45 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="22" y="27" width="26" height="21" rx="4" class="skin" transform="rotate(18 35 37)" />
    <circle cx="38" cy="18" r="8.5" class="skin" />
    <circle cx="42" cy="17" r="1.6" fill="#ff4757" stroke="none" />
    <!-- Machado cravando na frente -->
    <rect x="42" y="25" width="5" height="42" rx="1.5" class="wood" transform="rotate(52 44 46)" />
    <path d="M56 31 C63 25 67 27 68 33 C68 43 60 48 53 43 Z" class="metal" />
    <!-- Rastro de corte carmesim do Boss -->
    <path d="M40 8 C60 12 68 32 64 54" class="king-slash" />
  </g>

  <!-- FRAME 5: IMPACTO NO PISO (256 a 320px) -->
  <g id="king_atk_05" class="out" transform="translate(256, 0)">
    <path d="M17 46 L11 53 L13 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <path d="M32 46 L37 53 L41 58" fill="none" stroke="#2f3640" stroke-width="8" />
    <rect x="20" y="26" width="26" height="21" rx="4" class="skin" transform="rotate(8 33 36)" />
    <circle cx="34" cy="17" r="8.5" class="skin" />
    <circle cx="38" cy="16" r="1.6" fill="#ff4757" stroke="none" />
    <rect x="40" y="28" width="5" height="42" rx="1.5" class="wood" transform="rotate(40 42 49)" />
    <path d="M51 35 C58 29 62 31 63 37 C63 47 55 52 48 47 Z" class="metal" />
    <path d="M54 38 C58 44 57 49 54 54" class="king-slash" stroke-dasharray="3,3" />
  </g>

  <!-- FRAME 6: RECUPERAÇÃO DA GUARDA (320 a 384px) -->
  <g id="king_atk_06" class="out" transform="translate(320, 0)">
    <rect x="18" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="32" y="44" width="8" height="14" rx="2.5" class="armor" />
    <rect x="10" y="16" width="5" height="42" rx="1.5" class="wood" transform="rotate(-8 12 37)" />
    <path d="M6 14 C-1 8 -5 11 -7 18 C-7 28 1 33 8 26 Z" class="metal" />
    <rect x="16" y="24" width="26" height="23" rx="4" class="skin" />
    <circle cx="29" cy="15" r="8.5" class="skin" />
    <circle cx="33" cy="14" r="1.6" fill="#ff4757" stroke="none" />
    <path d="M22 11 L23 6 L26 9 L29 4 L32 9 L35 6 L36 11 Z" class="armor-light" />
  </g>
</svg>