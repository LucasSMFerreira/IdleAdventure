  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="55%" stop-color="#87ceeb" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <style>
